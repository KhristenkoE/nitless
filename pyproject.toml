[project]
name = "nitless"
version = "0.2.0"
description = "AI code review for GitHub pull requests and GitLab merge requests: high-signal findings, no nitpicks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11,<2",
    "httpx>=0.27",
    "openai>=3.19",
    "pathspec>=0.12",
    "pydantic>=2.8",
    "pydantic-settings>=2.7",
    "pyyaml>=6.0",  # YAML task sources
    "tree-sitter>=0.25.2,<0.26",  # 0.26.0: reading a temporary Point (node.start_point.row) is a use-after-free
    "tree-sitter-java>=0.23.5",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
]

[project.scripts]
nitless = "nitless.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nitless"]

[tool.ruff]
line-length = 120
extend-exclude = ["eval/repos"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
